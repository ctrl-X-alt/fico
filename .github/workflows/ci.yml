name: CI
on:
  push:
    branches: [main, prod-ready-foundation]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: node -e "require('./apps/api/src/server')"
      - run: npm run build -w apps/web
